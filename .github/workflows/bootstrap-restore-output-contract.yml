name: Bootstrap Restore Output Directive Evidence

on:
  push:
    branches:
      - docs/feature-roadmap-opengl-harness-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-restore-output-contract
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'krestosa/Focal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/feature-roadmap-opengl-harness-v2
          fetch-depth: 0

      - name: Restore merged IRIS-004 evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/IRIS-CAPABILITY-MATRIX.md")
          text = path.read_text(encoding="utf-8")

          buffer_row = "| `IRIS-BUFFER-003` | Shadow depth lifecycle | PARCIAL | `shadowtex0`–`1` use shadow resolution, fixed clear, no flipping and optional mipmaps/hardware comparison. | SAFE cannot depend on hardware comparison or shadowcolor mipmaps. | Static contract plus shadow pass framebuffer fixture. | `IRIS-003`, `SHADOW-001`, `PROFILE-001`, `GLCLI-006` |\n"
          output_rows = (
              "| `IRIS-OUTPUT-001` | Fragment output directives and constants | SOPORTADA | `RENDERTARGETS` maps fragment outputs in declared order; legacy `DRAWBUFFERS` is limited to indices 0–9. Formats, clears and clear colors are pack-global constants. | SAFE prefers `RENDERTARGETS`, requires every bound output to be initialized and limits required color attachments to `colortex0`–`7`. | Machine-readable output-directive contract, regression tests and later `focal-gl` framebuffer validation. | `IRIS-004`, `PIPE-005`, `PROFILE-001`, `SAFE-001`, `GLCLI-005` |\n"
              "| `IRIS-OUTPUT-002` | Per-buffer blending | PARCIAL | Program-level blending is supported; per-buffer blending depends on `PER_BUFFER_BLENDING`. | SAFE treats per-buffer blending as optional and falls back to program-level blending or disabled blending. | Static contract plus a runtime fixture comparing per-buffer and fallback paths. | `IRIS-004`, `PROFILE-001`, `GLCLI-005` |\n"
          )
          if "`IRIS-OUTPUT-001`" not in text:
              if buffer_row not in text:
                  raise SystemExit("buffer row marker not found")
              text = text.replace(buffer_row, buffer_row + output_rows, 1)

          terminal_heading = "## Terminal OpenGL runtime evidence\n"
          output_section = """## Output directive contract

The authoritative machine-readable contract is `spec/iris-output-directives.json`, covered by `tests/test_iris_output_directives.py`.

- `RENDERTARGETS` is the preferred fragment-output directive. Its comma-separated attachment indices map outputs by declaration order.
- When neither `RENDERTARGETS` nor `DRAWBUFFERS` is present, the first eight color attachments are bound by default.
- Every bound fragment output must be written; unwritten outputs are undefined and are rejected by the Focal contract.
- Legacy `DRAWBUFFERS` uses compact decimal indices and cannot address attachments above index 9.
- Buffer formats, clear enablement and clear colors are pack-global constants and must have one effective definition.
- Persistent buffers require clearing disabled and explicit initialization before first use; persistence does not by itself establish valid history.
- Per-buffer blending is capability-gated. SAFE falls back to program-level blending or disabled blending.

"""
          if "## Output directive contract" not in text:
              if terminal_heading not in text:
                  raise SystemExit("terminal section marker not found")
              text = text.replace(terminal_heading, output_section + terminal_heading, 1)

          text = text.replace(
              "`IRIS-004` remains the next Iris-format contract and may proceed only when it does not delay the harness foundation.",
              "`IRIS-005` remains the next Iris-format contract and may proceed only when it does not delay the harness foundation.",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/bootstrap-restore-output-contract.yml

      - name: Validate final tree
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -v tests

      - name: Publish matrix correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IRIS-CAPABILITY-MATRIX.md
          git commit -m "Preserve merged Iris output directive evidence"
          git push origin HEAD:docs/feature-roadmap-opengl-harness-v2
