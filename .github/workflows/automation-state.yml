name: Automation State Coordinator

on:
  issues:
    types:
      - edited
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: focal-automation-state
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.event_name != 'issues' || github.event.issue.number == 7
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out coordinator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Apply command to transactional state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
          STATE_ISSUE_NUMBER: "7"
        run: python -m tools.automation_state_v4 --issue "$STATE_ISSUE_NUMBER"

      - name: Restore issue mirror from canonical state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
          STATE_ISSUE_NUMBER: "7"
        run: python -m tools.automation_state_v4 --issue "$STATE_ISSUE_NUMBER" --mirror-only
