name: Automation State Coordinator

on:
  issues:
    types:
      - edited

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: focal-automation-state
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.event.issue.number == 7
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and apply state command
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_ISSUE_NUMBER: "7"
        run: |
          from __future__ import annotations

          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from typing import Any

          COMMAND_START = "<!-- focal-command:v3 -->"
          COMMAND_END = "<!-- /focal-command -->"
          STATE_START = "<!-- focal-state:v3 -->"
          STATE_END = "<!-- /focal-state -->"
          ALLOWED_OPERATIONS = {
              "acquire",
              "recover",
              "heartbeat",
              "release",
              "inspect",
              "cleanup_branches",
          }

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          issue_number = int(os.environ["STATE_ISSUE_NUMBER"])

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          sender = (event.get("sender") or {}).get("login")
          repository_owner = repository.split("/", 1)[0]
          if sender not in {repository_owner, "github-actions[bot]"}:
              print(f"ignoring edit from unauthorized sender: {sender}")
              raise SystemExit(0)

          def api(method: str, path: str, payload: dict[str, Any] | None = None) -> Any:
              data = None
              if payload is not None:
                  data = json.dumps(payload, separators=(",", ":")).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "focal-automation-state",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  details = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API {method} {path} failed: {exc.code} {details}"
                  ) from exc
              return json.loads(raw) if raw else None

          def api_pages(path: str) -> list[dict[str, Any]]:
              values: list[dict[str, Any]] = []
              page = 1
              separator = "&" if "?" in path else "?"
              while True:
                  batch = api("GET", f"{path}{separator}per_page=100&page={page}")
                  if not isinstance(batch, list):
                      raise ValueError(f"paginated endpoint did not return a list: {path}")
                  values.extend(item for item in batch if isinstance(item, dict))
                  if len(batch) < 100:
                      return values
                  page += 1

          def now_utc() -> datetime:
              return datetime.now(timezone.utc)

          def now_iso() -> str:
              return now_utc().isoformat().replace("+00:00", "Z")

          def parse_timestamp(value: Any) -> datetime | None:
              if not isinstance(value, str) or not value:
                  return None
              normalized = value[:-1] + "+00:00" if value.endswith("Z") else value
              parsed = datetime.fromisoformat(normalized)
              if parsed.tzinfo is None:
                  raise ValueError(f"timestamp lacks timezone: {value}")
              return parsed.astimezone(timezone.utc)

          def extract_block(
              body: str,
              start: str,
              end: str,
          ) -> tuple[dict[str, Any], int, int]:
              pattern = re.compile(
                  re.escape(start) + r"\s*```json\s*(.*?)\s*```\s*" + re.escape(end),
                  flags=re.DOTALL,
              )
              match = pattern.search(body)
              if not match:
                  raise ValueError(f"missing or malformed block: {start}")
              value = json.loads(match.group(1))
              if not isinstance(value, dict):
                  raise ValueError(f"block must contain a JSON object: {start}")
              return value, match.start(), match.end()

          def replace_state(body: str, state: dict[str, Any]) -> str:
              _, start, end = extract_block(body, STATE_START, STATE_END)
              rendered = json.dumps(state, indent=2, sort_keys=False)
              replacement = f"{STATE_START}\n```json\n{rendered}\n```\n{STATE_END}"
              return body[:start] + replacement + body[end:]

          def branch_prs(branch: str, state_name: str) -> list[dict[str, Any]]:
              query = urllib.parse.urlencode(
                  {
                      "state": state_name,
                      "head": f"{repository_owner}:{branch}",
                  }
              )
              return api_pages(f"/repos/{repository}/pulls?{query}")

          def cleanup_branches(
              command: dict[str, Any],
              state: dict[str, Any],
              processed_at: str,
          ) -> tuple[bool, str]:
              if state.get("status") != "idle":
                  return False, "ACTIVE_LEASE"

              legacy = command.get("legacyBranches", ["automation/runtime-state"])
              if not isinstance(legacy, list) or not all(
                  isinstance(item, str) and item for item in legacy
              ):
                  raise ValueError("legacyBranches must be a list of branch names")
              legacy_names = set(legacy)

              repository_info = api("GET", f"/repos/{repository}")
              default_branch = repository_info.get("default_branch")
              if not isinstance(default_branch, str) or not default_branch:
                  raise ValueError("repository default branch is unavailable")

              deleted: list[dict[str, str]] = []
              skipped: list[dict[str, str]] = []

              for branch_info in api_pages(f"/repos/{repository}/branches"):
                  branch = branch_info.get("name")
                  tip_sha = ((branch_info.get("commit") or {}).get("sha"))
                  if not isinstance(branch, str) or not isinstance(tip_sha, str):
                      continue
                  if branch == default_branch:
                      skipped.append({"branch": branch, "reason": "DEFAULT_BRANCH"})
                      continue
                  if branch_info.get("protected"):
                      skipped.append({"branch": branch, "reason": "PROTECTED"})
                      continue

                  if branch_prs(branch, "open"):
                      skipped.append({"branch": branch, "reason": "OPEN_PULL_REQUEST"})
                      continue

                  merged_prs = branch_prs(branch, "closed")
                  merged_exact_head = any(
                      pr.get("merged_at")
                      and ((pr.get("head") or {}).get("sha") == tip_sha)
                      for pr in merged_prs
                  )

                  base = urllib.parse.quote(branch, safe="")
                  head = urllib.parse.quote(default_branch, safe="")
                  comparison = api(
                      "GET",
                      f"/repos/{repository}/compare/{base}...{head}",
                  )
                  fully_behind = comparison.get("status") in {"ahead", "identical"}
                  is_legacy = branch in legacy_names

                  if not (merged_exact_head or fully_behind or is_legacy):
                      skipped.append(
                          {"branch": branch, "reason": "UNMERGED_WORK_PRESERVED"}
                      )
                      continue

                  encoded = urllib.parse.quote(branch, safe="")
                  api("DELETE", f"/repos/{repository}/git/refs/heads/{encoded}")
                  if is_legacy:
                      reason = "LEGACY"
                  elif fully_behind:
                      reason = "FULLY_BEHIND_MAIN"
                  else:
                      reason = "MERGED_PULL_REQUEST"
                  deleted.append({"branch": branch, "reason": reason})

              state["lastBranchCleanupAt"] = processed_at
              state["lastBranchCleanupDeleted"] = deleted
              state["lastBranchCleanupSkipped"] = skipped
              state["note"] = command.get("note")
              return True, "BRANCH_CLEANUP_COMPLETED"

          issue = api("GET", f"/repos/{repository}/issues/{issue_number}")
          body = issue.get("body") or ""
          command, _, _ = extract_block(body, COMMAND_START, COMMAND_END)
          state, _, _ = extract_block(body, STATE_START, STATE_END)

          command_id = command.get("commandId")
          operation = command.get("operation")
          run_id = command.get("runId")

          if command.get("schemaVersion") != 3:
              raise ValueError("command schemaVersion 3 is required")
          if state.get("schemaVersion") != 3:
              raise ValueError("state schemaVersion 3 is required")
          if state.get("repository") != repository:
              raise ValueError("state repository does not match workflow repository")
          if not isinstance(command_id, str) or not command_id:
              raise ValueError("commandId is required")
          if operation not in ALLOWED_OPERATIONS:
              raise ValueError(f"unsupported operation: {operation}")
          if operation not in {"inspect", "cleanup_branches"} and (
              not isinstance(run_id, str) or not run_id
          ):
              raise ValueError("runId is required")

          if state.get("lastCommandId") == command_id:
              print(f"command already processed: {command_id}")
              raise SystemExit(0)

          processed_at = now_iso()
          current_expiry = parse_timestamp(state.get("leaseExpiresAt"))
          lease_active = (
              state.get("status") == "working"
              and current_expiry is not None
              and current_expiry > now_utc()
          )
          accepted = False
          reason = ""

          try:
              if operation == "inspect":
                  accepted = True
                  reason = "STATE_OBSERVED"

              elif operation == "cleanup_branches":
                  accepted, reason = cleanup_branches(command, state, processed_at)

              elif operation in {"acquire", "recover"}:
                  requested_expiry = parse_timestamp(command.get("leaseExpiresAt"))
                  if requested_expiry is None or requested_expiry <= now_utc():
                      raise ValueError("leaseExpiresAt must be in the future")
                  if lease_active and state.get("runId") != run_id:
                      reason = "ACTIVE_LEASE"
                  else:
                      state.update(
                          {
                              "status": "working",
                              "mode": (
                                  "recovery"
                                  if operation == "recover"
                                  else command.get("mode", "normal")
                              ),
                              "phase": command.get("phase", "LOCK_ACQUISITION"),
                              "runId": run_id,
                              "owner": command.get("owner"),
                              "executionSource": command.get("executionSource"),
                              "startedAt": command.get("startedAt"),
                              "heartbeatAt": command.get(
                                  "heartbeatAt",
                                  command.get("startedAt"),
                              ),
                              "leaseExpiresAt": command.get("leaseExpiresAt"),
                              "softStopAt": command.get("softStopAt"),
                              "cleanupAt": command.get("cleanupAt"),
                              "hardKillAt": command.get("hardKillAt"),
                              "deadlineAt": command.get("deadlineAt"),
                              "baseMainSha": command.get("baseMainSha"),
                              "workBranch": command.get("workBranch"),
                              "workBranchHeadSha": command.get("workBranchHeadSha"),
                              "pullRequest": command.get("pullRequest"),
                              "checkpointSha": command.get("checkpointSha"),
                              "note": command.get("note"),
                          }
                      )
                      accepted = True
                      reason = (
                          "LEASE_ACQUIRED"
                          if operation == "acquire"
                          else "LEASE_RECOVERED"
                      )

              elif operation == "heartbeat":
                  requested_expiry = parse_timestamp(command.get("leaseExpiresAt"))
                  if (
                      state.get("status") != "working"
                      or state.get("runId") != run_id
                  ):
                      reason = "NOT_LEASE_OWNER"
                  elif requested_expiry is None or requested_expiry <= now_utc():
                      raise ValueError("leaseExpiresAt must be in the future")
                  else:
                      for key in (
                          "phase",
                          "heartbeatAt",
                          "leaseExpiresAt",
                          "workBranch",
                          "workBranchHeadSha",
                          "pullRequest",
                          "checkpointSha",
                          "note",
                      ):
                          if key in command:
                              state[key] = command[key]
                      accepted = True
                      reason = "HEARTBEAT_ACCEPTED"

              elif operation == "release":
                  if (
                      state.get("status") != "working"
                      or state.get("runId") != run_id
                  ):
                      reason = "NOT_LEASE_OWNER"
                  else:
                      previous_run_id = state.get("runId")
                      checkpoint = command.get(
                          "checkpointSha",
                          state.get("checkpointSha"),
                      )
                      state.update(
                          {
                              "status": "idle",
                              "mode": "normal",
                              "phase": "idle",
                              "runId": None,
                              "owner": None,
                              "executionSource": None,
                              "startedAt": None,
                              "heartbeatAt": None,
                              "leaseExpiresAt": None,
                              "softStopAt": None,
                              "cleanupAt": None,
                              "hardKillAt": None,
                              "deadlineAt": None,
                              "baseMainSha": None,
                              "workBranch": None,
                              "workBranchHeadSha": None,
                              "pullRequest": None,
                              "checkpointSha": checkpoint,
                              "lastCompletedAt": command.get("completedAt"),
                              "lastResult": command.get("result"),
                              "lastRunId": previous_run_id,
                              "note": command.get("note"),
                          }
                      )
                      accepted = True
                      reason = "LEASE_RELEASED"

          except Exception as exc:
              accepted = False
              reason = f"COMMAND_ERROR: {exc}"

          state["lastCommandId"] = command_id
          state["lastCommandAccepted"] = accepted
          state["lastCommandReason"] = reason
          state["lastCommandProcessedAt"] = processed_at
          state["version"] = int(state.get("version", 0)) + 1

          updated_body = replace_state(body, state)
          api(
              "PATCH",
              f"/repos/{repository}/issues/{issue_number}",
              {"body": updated_body},
          )

          print(
              json.dumps(
                  {
                      "accepted": accepted,
                      "commandId": command_id,
                      "reason": reason,
                      "stateVersion": state["version"],
                      "status": state.get("status"),
                      "runId": state.get("runId"),
                      "deletedBranches": state.get("lastBranchCleanupDeleted"),
                      "skippedBranches": state.get("lastBranchCleanupSkipped"),
                  },
                  sort_keys=True,
              )
          )

          if not accepted:
              raise SystemExit(3)
