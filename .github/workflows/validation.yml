name: Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate repository structure and tracked text
        shell: python
        run: |
          from __future__ import annotations

          import json
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          failures: list[str] = []

          required = [root / "README.md"]
          for path in required:
              if not path.is_file():
                  failures.append(f"missing required file: {path.relative_to(root)}")

          forbidden_suffixes = {".exe", ".dll", ".so", ".dylib", ".class", ".jar"}
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              relative = path.relative_to(root)
              if path.suffix.lower() in forbidden_suffixes:
                  failures.append(f"unexpected tracked binary candidate: {relative}")
              if path.suffix.lower() == ".json":
                  try:
                      json.loads(path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      failures.append(f"invalid JSON {relative}: {exc}")
              if path.suffix.lower() in {".md", ".txt", ".yml", ".yaml", ".json", ".py", ".glsl", ".vsh", ".fsh", ".properties"}:
                  try:
                      data = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError as exc:
                      failures.append(f"non-UTF-8 text file {relative}: {exc}")
                      continue
                  if "\x00" in data:
                      failures.append(f"embedded NUL in text file: {relative}")

          if failures:
              print("Validation failed:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)

          print("Repository bootstrap validation passed.")

      - name: Validate runtime guard behavior
        shell: python
        env:
          PYTHONPATH: .
        run: |
          from __future__ import annotations

          import sys

          from tools.runtime_guard import supervise

          completed = supervise(
              [sys.executable, "-c", "raise SystemExit(0)"],
              limit_seconds=2.0,
              soft_stop_seconds=1.0,
              grace_seconds=0.5,
              phase="IMPLEMENTATION",
          )
          assert completed.exit_code == 0
          assert not completed.soft_stop_triggered
          assert not completed.hard_kill_triggered
          assert completed.signal_sent is None

          stopped = supervise(
              [sys.executable, "-c", "import time; time.sleep(5)"],
              limit_seconds=2.0,
              soft_stop_seconds=0.1,
              grace_seconds=0.5,
              phase="IMPLEMENTATION",
          )
          assert stopped.soft_stop_triggered
          assert not stopped.hard_kill_triggered
          assert stopped.signal_sent == "SIGTERM_SOFT_STOP"
          assert stopped.elapsed_seconds < 2.0

          allowed = supervise(
              [sys.executable, "-c", "import time; time.sleep(0.2)"],
              limit_seconds=2.0,
              soft_stop_seconds=0.05,
              grace_seconds=0.5,
              phase="CLEANUP",
          )
          assert allowed.exit_code == 0
          assert allowed.soft_stop_triggered
          assert not allowed.hard_kill_triggered
          assert allowed.signal_sent is None

          print("Runtime guard validation passed.")
