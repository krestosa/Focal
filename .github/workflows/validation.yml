name: Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate repository structure and tracked text
        shell: python
        run: |
          from __future__ import annotations

          import json
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          failures: list[str] = []

          required = [root / "README.md"]
          for path in required:
              if not path.is_file():
                  failures.append(f"missing required file: {path.relative_to(root)}")

          forbidden_suffixes = {".exe", ".dll", ".so", ".dylib", ".class", ".jar"}
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              relative = path.relative_to(root)
              if path.suffix.lower() in forbidden_suffixes:
                  failures.append(f"unexpected tracked binary candidate: {relative}")
              if path.suffix.lower() == ".json":
                  try:
                      json.loads(path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      failures.append(f"invalid JSON {relative}: {exc}")
              if path.suffix.lower() in {".md", ".txt", ".yml", ".yaml", ".json", ".py", ".glsl", ".vsh", ".fsh", ".properties"}:
                  try:
                      data = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError as exc:
                      failures.append(f"non-UTF-8 text file {relative}: {exc}")
                      continue
                  if "\x00" in data:
                      failures.append(f"embedded NUL in text file: {relative}")

          if failures:
              print("Validation failed:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)

          print("Repository bootstrap validation passed.")

      - name: Run runtime guard unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -v tests

  mesa-egl-probe:
    name: Mesa EGL software probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "true"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Mesa EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            mesa-utils

      - name: Run real Mesa EGL probe
        run: |
          python tools/focal_gl.py probe \
            --backend egl \
            --gl-version 3.3 \
            --gl-profile core \
            --size 64x64 \
            --json > focal-gl-probe.json

      - name: Validate probe evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          result = json.loads(Path("focal-gl-probe.json").read_text(encoding="utf-8"))
          assert result["outcome"] == "PASS", result
          assert result["exitCode"] == 0, result
          assert result["evidenceLevel"] == "STATIC", result
          context = result["context"]
          assert context["backend"].startswith("egl"), context
          assert context["vendor"], context
          assert context["renderer"], context
          assert context["version"], context
          assert context["glslVersion"], context
          assert context["limits"], context
          print(json.dumps(result, indent=2, sort_keys=True))
