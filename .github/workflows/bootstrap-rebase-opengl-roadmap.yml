name: Bootstrap Reconciled OpenGL Roadmap

on:
  push:
    branches:
      - docs/feature-roadmap-opengl-harness-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-rebase-opengl-roadmap
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'krestosa/Focal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main-based branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/feature-roadmap-opengl-harness-v2
          fetch-depth: 0

      - name: Import proposal and reconcile current main evidence
        run: |
          git fetch origin docs/detail-features-and-opengl-harness
          git show origin/docs/detail-features-and-opengl-harness:docs/ROADMAP.md > docs/ROADMAP.md
          git show origin/docs/detail-features-and-opengl-harness:docs/IRIS-CAPABILITY-MATRIX.md > docs/IRIS-CAPABILITY-MATRIX.md
          git show origin/docs/detail-features-and-opengl-harness:docs/OPENGL-RUNTIME-HARNESS.md > docs/OPENGL-RUNTIME-HARNESS.md
          git show origin/docs/detail-features-and-opengl-harness:tests/test_roadmap_runtime_contract.py > tests/test_roadmap_runtime_contract.py
          python - <<'PY'
          from pathlib import Path

          main_sha = "edf287f5dbb0aaff379432d05697936141f23638"

          roadmap_path = Path("docs/ROADMAP.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          roadmap = roadmap.replace(
              "- Canonical Iris evidence: [`IRIS-CAPABILITY-MATRIX.md`](IRIS-CAPABILITY-MATRIX.md)\n",
              "- Canonical Iris evidence: [`IRIS-CAPABILITY-MATRIX.md`](IRIS-CAPABILITY-MATRIX.md)\n"
              "- Canonical terminal OpenGL harness contract: [`OPENGL-RUNTIME-HARNESS.md`](OPENGL-RUNTIME-HARNESS.md)\n",
              1,
          )
          roadmap = roadmap.replace(
              "- Baseline audited: `a923de04de5aa0f97dc0420e80ea9623d24bae53`",
              f"- Baseline audited: `{main_sha}`",
              1,
          )
          roadmap = roadmap.replace("- Roadmap schema revision: `7`", "- Roadmap schema revision: `9`", 1)
          pending = "| [ ] ⚪ `IRIS-004` | P0 | Output constants and directives: `RENDERTARGETS`, `DRAWBUFFERS`, formats, clears, clear colors and blend. | Parser rejects invalid targets, duplicate bindings, unwritten outputs and incompatible formats; later `GL_RENDER_READBACK` verifies attachments. | [Constants][iris-constants], [RENDERTARGETS][iris-rendertargets], [DRAWBUFFERS][iris-drawbuffers], [Buffer format][iris-buffer-format] | Implement contract after `GLCLI-001` foundation starts. |"
          complete = "| [x] 🟢 `IRIS-004` | P0 | Output constants and directives: `RENDERTARGETS`, `DRAWBUFFERS`, formats, clears, clear colors and blend. | `spec/iris-output-directives.json` and `tests/test_iris_output_directives.py` are merged through PR #58 with Validation run `30421966410`; runtime attachment acceptance remains assigned to `GLCLI-005`. | [Constants][iris-constants], [RENDERTARGETS][iris-rendertargets], [DRAWBUFFERS][iris-drawbuffers], [Buffer format][iris-buffer-format] | Preserve the static contract and add runtime framebuffer evidence. |"
          if pending not in roadmap:
              raise SystemExit("IRIS-004 pending row not found")
          roadmap = roadmap.replace(pending, complete, 1)
          roadmap = roadmap.replace(
              "- `2026-07-29` — Revision 7 expanded every roadmap feature with observable scope, acceptance/tests and direct Iris documentation; added the mandatory `focal-gl` OpenGL runtime harness family.",
              "- `2026-07-29` — Revision 7 began the output-directive contract and its validation.\n"
              "- `2026-07-29` — Revision 8 accepted the merged output-directive contract and advanced Iris-format work to `IRIS-005`.\n"
              "- `2026-07-29` — Revision 9 expanded every roadmap feature with observable scope, acceptance/tests and direct Iris documentation; added the mandatory `focal-gl` OpenGL runtime harness family.",
              1,
          )
          roadmap_path.write_text(roadmap, encoding="utf-8")

          matrix_path = Path("docs/IRIS-CAPABILITY-MATRIX.md")
          matrix = matrix_path.read_text(encoding="utf-8")
          matrix = matrix.replace(
              "- Focal baseline: `a923de04de5aa0f97dc0420e80ea9623d24bae53`",
              f"- Focal baseline: `{main_sha}`",
              1,
          )
          marker = "- Machine-readable buffer lifecycle contract: [`../spec/iris-buffer-lifecycle.json`](../spec/iris-buffer-lifecycle.json)\n"
          output_contract = "- Machine-readable output-directive contract: [`../spec/iris-output-directives.json`](../spec/iris-output-directives.json)\n"
          if output_contract not in matrix:
              matrix = matrix.replace(marker, marker + output_contract, 1)
          matrix = matrix.replace(
              "`IRIS-001`, `IRIS-002` and `IRIS-003` are complete at their current `STATIC` evidence level through machine-readable contracts, regression tests and synchronized roadmap evidence.",
              "`IRIS-001`, `IRIS-002`, `IRIS-003` and `IRIS-004` are complete at their current `STATIC` evidence level through machine-readable contracts, regression tests and synchronized roadmap evidence.",
              1,
          )
          matrix_path.write_text(matrix, encoding="utf-8")
          PY
          rm .github/workflows/bootstrap-rebase-opengl-roadmap.yml

      - name: Validate reconciled tree
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -v tests

      - name: Publish reconciled non-workflow files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md docs/IRIS-CAPABILITY-MATRIX.md docs/OPENGL-RUNTIME-HARNESS.md tests/test_roadmap_runtime_contract.py
          git commit -m "Reconcile detailed roadmap with current main"
          git push origin HEAD:docs/feature-roadmap-opengl-harness-v2
