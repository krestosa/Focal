name: Automation Terminal Guard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: focal-automation-state
  cancel-in-progress: false

jobs:
  inspect-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Release expired or hard-stopped lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: >-
          python -m tools.automation_terminal_guard
          --repository "$GITHUB_REPOSITORY"
          --issue 7
          --expiry-grace-seconds 120
          --activity-grace-seconds 900
