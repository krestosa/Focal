name: Stale Lease Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: focal-automation-state
  cancel-in-progress: false

jobs:
  inspect-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Release expired lease when remote work is inactive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/stale_lease_watchdog.py
          --repository "$GITHUB_REPOSITORY"
          --issue 7
          --expiry-grace-seconds 120
          --activity-grace-seconds 900
