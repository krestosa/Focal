name: Repository Maintenance

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: focal-final-cleanup
  cancel-in-progress: false

jobs:
  maintain:
    if: github.head_ref == 'maintenance/final-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove non-default branches
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def api(method: str, path: str):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "focal-maintenance",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  details = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {details}") from exc
              return json.loads(raw) if raw else None

          branches: list[str] = []
          page = 1
          while True:
              batch = api("GET", f"/repos/{repository}/branches?per_page=100&page={page}")
              if not batch:
                  break
              branches.extend(item["name"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          deleted: list[str] = []
          for branch in branches:
              if branch == "main":
                  continue
              encoded = urllib.parse.quote(branch, safe="")
              api("DELETE", f"/repos/{repository}/git/refs/heads/{encoded}")
              deleted.append(branch)

          print(json.dumps({"status": "ok", "deleted": deleted}, sort_keys=True))
